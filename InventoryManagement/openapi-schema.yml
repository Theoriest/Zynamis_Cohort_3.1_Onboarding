    ResourceBrowse:
      type: object
      description: |-
        Read-only resource view for employees browsing the catalogue.

        ``available`` is the number of units free for the requested date range
        (derived from approved bookings). When no range is supplied it reports the
        total quantity. Internal reservation state is never exposed directly.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        category:
          type: integer
          readOnly: true
        category_name:
          type: string
          readOnly: true
        total_quantity:
          type: integer
          readOnly: true
        available:
          type: integer
          readOnly: true
        location:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - available
      - category
      - category_name
      - description
      - id
      - is_active
      - location
      - name
      - total_quantity
