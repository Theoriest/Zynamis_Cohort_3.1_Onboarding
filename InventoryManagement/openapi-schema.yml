            application/json:
              schema:
                $ref: '#/components/schemas/ResourceBrowse'
          description: ''
components:
  schemas:
    Booking:
      type: object
      description: |-
        Create and represent a booking with its nested items.

        The requesting user is taken from the request, never the payload.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        rejection_reason:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingItem'
        date_created:
          type: string
          format: date-time
          readOnly: true
        date_updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_created
      - date_updated
      - end_date
      - id
      - items
      - rejection_reason
      - start_date
      - status
      - user
    BookingDetail:
      type: object
      description: 'Booking representation for managers: includes the requesting user.'
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/RequestingUser'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        rejection_reason:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingItem'
        date_created:
          type: string
          format: date-time
          readOnly: true
        date_updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_created
      - date_updated
      - end_date
      - id
      - items
      - rejection_reason
      - start_date
      - status
      - user
    BookingItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        resource:
          type: integer
        resource_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - id
      - resource
      - resource_name
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
