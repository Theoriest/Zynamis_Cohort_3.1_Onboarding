openapi: 3.0.3
info:
  title: Inventory Management API
  version: 1.0.0
  description: Equipment and shared-resource booking system with role-based access
    (Admin / Resource Manager / Employee).
paths:
  /api/approvals/bookings/:
    get:
      operationId: approvals_bookings_list
      description: |-
        Managers view all booking requests and approve or reject them.

        List and detail show the requesting user. Approval reserves stock inside
        a transaction; by the FIFO decision the first approval to exhaust stock
        blocks later overlapping requests.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - approvals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingDetailList'
          description: ''
  /api/approvals/bookings/{id}/:
    get:
      operationId: approvals_bookings_retrieve
      description: |-
        Managers view all booking requests and approve or reject them.

        List and detail show the requesting user. Approval reserves stock inside
        a transaction; by the FIFO decision the first approval to exhaust stock
        blocks later overlapping requests.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this booking.
        required: true
      tags:
      - approvals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/approvals/bookings/{id}/approve/:
    post:
      operationId: approvals_bookings_approve_create
      description: Approve a pending request, reserving stock atomically (FIFO).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this booking.
        required: true
      tags:
      - approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingDetail'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/approvals/bookings/{id}/reject/:
    post:
      operationId: approvals_bookings_reject_create
      description: Reject a pending request with a required reason.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this booking.
        required: true
      tags:
      - approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingDetail'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
