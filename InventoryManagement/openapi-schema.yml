          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/bookings/:
    get:
      operationId: bookings_list
      description: |-
        Employees submit, browse and cancel their own bookings.

        An employee only ever sees their own bookings here; managers use the
        approval views to see everyone's. Cancellation is open for now (business
        rules pending), so an employee may cancel any of their bookings.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: bookings_create
      description: |-
        Employees submit, browse and cancel their own bookings.

        An employee only ever sees their own bookings here; managers use the
        approval views to see everyone's. Cancellation is open for now (business
        rules pending), so an employee may cancel any of their bookings.
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Booking'
          multipart/form-data:
